[report]
title = "crc 3.4.0: selected checksum and digest contracts"
explanation = '''
For the built-in `Table<0>` and `Table<1>` implementations at word widths 8, 16, 32, 64 and 128, the selected `checksum` bodies succeed and agree with a direct CRC register model on every representable byte slice, including empty input. The model feeds each byte in the input-reflection order, applies output reflection and XOR at the end, and appends no zero block. The selected `update` bodies succeed from any encoded canonical state, advance it by that model and retain the CRC object. Both reflection flags may vary independently.

These statements require `1 <= width <=` the storage width and a polynomial within that width; checksum additionally requires bounded XOR output. For all `Table<0>` and for `Table<1>` u32, u64 and u128 checksum contracts, the initial value is interpreted by its low `width` bits. The `Table<1>` u8 and u16 checksum contracts instead require bounded initial values. `Table<1>` requires its current cached table to match the current width, polynomial and input-reflection flag. Update requires the incoming state to encode a canonical width-bit state. Exact per-instance premises appear with the mappings below. For all three built-in lanes and valid widths, `digest_with_initial` retains the CRC object and initializes from the low width bits of its input; `digest` uses the algorithm initial value. `finalize` succeeds for any raw digest word and applies the specified word-level reflection, shift and XOR operations. These endpoint contracts do not by themselves prove a canonical message computation. The selected `Table<0>` constructors succeed and retain the algorithm under their recorded width conditions; selected `Table<1>` constructors also establish table coherence under their recorded polynomial bounds. Actual two-chunk update equivalence is separately proved for full-width unreflected u8; no all-width chunking theorem is claimed.

This profile adds 75 callable instances to the default profile's 21, for 96 of 171 supported built-in instances. These count parameter and lane specializations, not distinct API names; supporting lemmas are not additional API coverage.
'''
trusted_assumptions = '''
The results depend on Rust-to-LLBC and Aeneas translation, primitive models, and the Lean kernel. Local bit-reversal definitions are assumed to match Rust's standard operations. The type-only normalization lifts the built-in table associated type to the exact array type; an independent structural checker compares function bodies and permits only the specified type-reference changes. A display-name change preserves indices and operations, and negative guards reject unsupported normalization shapes. File-name relocation is checked by inverse equality of the complete JSON tree. These checks support the transformations but are not semantic preservation or compiler-correctness proofs. The transitive audit permits only `propext`, `Classical.choice`, and `Quot.sound`.
'''
limitations = '''
`Algorithm` fields are public, so invalid widths or out-of-range parameters are not ruled out by Rust types. `Crc.algorithm` can also be replaced after construction, leaving a `Table<1>` cache stale; construction alone does not establish coherence after such a change. `Table<0>` has no cached-table coherence requirement. The canonical `Table<16>` message computation, custom implementations, other lanes and re-exported dependency APIs are outside this coverage. The proofs do not validate catalogue `check` or `residue` values.

The selected executable crate bodies come from the locked crates.io 3.4.0 archive. Extraction uses the described transformations and locally authored bit-reversal models; their correspondence to release execution is supported by structural checks and native observations, not a formal equivalence theorem.
'''
environment = '''
The formal extraction selected the library with Cargo default features; the crate declares no feature flags. The current-input run passed on 2026-10-23 on `aarch64-apple-darwin`; Linux candidate files do not constitute a fresh Linux run. Native tests and independent oracle examples are finite observations, separate from the quantified Lean proofs. Charon and Aeneas are pinned and unpatched; the pinned `cargo-proofs` CLI has a preparation patch for source and tool preparation, provenance and audit handling. Fresh extraction is compared with maintained models and named roots are audited. Earlier full run records are local-only. See the [results](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/stage2/results.md), [theorem inventory](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/stage2/theorems.json), [specification](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/stage2/specification.md), [transformation boundary](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/stage2/trust-boundary.md), [source lock](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/source.lock.json), and [CLI preparation patch](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/stage2/patches/cargo-proofs-preparation.patch). These records predate this editorial revision.
'''

