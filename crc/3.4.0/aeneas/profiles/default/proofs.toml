[report]
title = "crc 3.4.0: table access and clone contracts"
explanation = '''
For the five built-in word widths and `Table<0>`, `Table<1>`, and `Table<16>`, `Crc::table` succeeds and returns the stored table, regardless of its contents. The zero-sized `Table<0>`, `Table<1>`, and `Table<16>` implementation markers separately have identity `clone` and source-replacement `clone_from` contracts; these do not clone the cached table data. These 21 callable instances are width/lane specializations, not 21 distinct API names. Separate private polynomial-kernel proofs do not establish a checksum result.
'''
trusted_assumptions = '''
The results depend on the Rust-to-LLBC and Aeneas translations, their primitive models, and the Lean kernel. These are not compiler-correctness proofs. The accepted audit permits only Lean's `propext`, `Classical.choice`, and `Quot.sound` as transitive axioms.
'''
limitations = '''
These contracts do not establish that stored tables contain correct CRC transitions, that constructors produce them, or that checksums or digest updates are correct. Custom implementations, other lanes and re-exported dependency APIs are outside the selected scope. The verified source is restored from the locked crates.io 3.4.0 archive; the selected executable crate bodies are unchanged. The extraction and model correspondence checks are evidence for this relationship, not a formal proof of compiler correctness.
'''
environment = '''
The formal extraction selected the library with Cargo default features; the crate declares no feature flags. The current-input run passed on 2026-10-23 on `aarch64-apple-darwin`; Linux candidate files do not constitute a fresh Linux run. Native tests are finite observations, separate from the Lean proofs. The pinned `cargo-proofs` CLI has a preparation patch for source and tool preparation, provenance and audit handling; it does not change the stated CRC contracts. The run checks fresh extraction against maintained models and audits named roots. File-name metadata relocation is checked by inverse whole-JSON equality, rather than proved semantically. Earlier full run records are local-only. See the [results](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/default/results.md), [theorem inventory](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/default/theorems.json), [source lock](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/source.lock.json), and [CLI preparation patch](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/crc/3.4.0/aeneas/profiles/default/patches/cargo-proofs-preparation.patch). These records predate this editorial revision.
'''

