[report]
title = "crc 3.4.0: table access and clone contracts"
explanation = '''
For the five built-in word widths and `Table<0>`, `Table<1>`, and `Table<16>`, `Crc::table` succeeds and returns the stored table, regardless of its contents. The zero-sized `Table<0>`, `Table<1>`, and `Table<16>` implementation markers separately have identity `clone` and source-replacement `clone_from` contracts; these do not clone the cached table data. These 21 callable instances are width/lane specializations, not 21 distinct API names. Separate private polynomial-kernel proofs do not establish a checksum result.
'''
trusted_assumptions = '''
The results depend on the Rust-to-LLBC and Aeneas translations, their primitive models, and the Lean kernel. These are not compiler-correctness proofs. The accepted audit permits only Lean's `propext`, `Classical.choice`, and `Quot.sound` as transitive axioms.
'''
limitations = '''
These contracts do not establish that stored tables contain correct CRC transitions, that constructors produce them, or that checksums or digest updates are correct. Custom implementations, other lanes and re-exported dependency APIs are outside the selected scope. The verified source is restored from the locked crates.io 3.4.0 archive; the selected executable crate bodies are unchanged. The extraction and model correspondence checks are evidence for this relationship, not a formal proof of compiler correctness.
'''
environment = '''
The selected library uses Cargo default features; the crate declares no feature flags. The target is `aarch64-apple-darwin` (macOS arm64). The unchanged locked release source is kept under `upstream/`; the configuration uses `cargo-proofs` 0.4.1 with a local API-discovery patch and pinned, unpatched Charon and Aeneas. The upstream scanner cannot resolve the concrete CRC word and lane instance names. The opt-in patch checks configuration-selected function declarations and Rust function-item probes, including the default `Clone::clone_from`, against the locked dependency graph and host configuration. It uses no substitute implementations or proof-success markers and changes neither Rust bodies and contracts nor the Lean checker. `RUSTC_BOOTSTRAP` is scoped to declaration expansion; the witness check uses stable Rust. The ordinary Lean build and audit determine proof acceptance. Native tests are finite observations, separate from the Lean proofs. The historical run passed on 2026-10-23 under the earlier configuration; it does not establish a fresh run of this configuration. See the historical [results](https://github.com/keiichiw/crate-proofs/blob/06d2413e7a6e8d809f0105df99c97368139fa54c/crc/3.4.0/aeneas/profiles/default/results.md), [theorem inventory](https://github.com/keiichiw/crate-proofs/blob/06d2413e7a6e8d809f0105df99c97368139fa54c/crc/3.4.0/aeneas/profiles/default/theorems.json), and [source lock](https://github.com/keiichiw/crate-proofs/blob/06d2413e7a6e8d809f0105df99c97368139fa54c/crc/3.4.0/source.lock.json).
'''

[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "aeneas/profiles/default/proofs"
concrete_api = true

[[tool.proofs]]
api = "Crc<u8, Table<0>>::table"
module = "CrcProofs.Table"
theorem = "CrcProofs.table_u8_l0_spec"
precondition = "true"

