# Version-local prover commands; per-query CVC5 timeout exits cleanly on macOS.
[prover]
name = "Alt-Ergo"
command = "alt-ergo --timelimit %.t %f"
driver = "alt_ergo_26"

[prover]
name = "Z3"
command = "z3 -smt2 -T:%t sat.random_seed=42 nlsat.randomize=false smt.random_seed=42 -st %f"
driver = "z3_4_12"

[prover]
name = "CVC5"
command = "cvc5 --stats-internal --tlimit-per=%T %f"
driver = "cvc5"

[prover]
name = "CVC4"
command = "cvc4 --stats --tlimit=%T --lang=smt2 %f"
driver = "cvc4_17"

