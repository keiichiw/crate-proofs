[package]
name = "ipnet-minimal-schema-repro"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[[bin]]
name = "schema-minimal"
path = "schema-minimal.rs"
[dependencies]
ipnet = { path = "../../..", features = ["serde", "schemars08", "schemars1"] }
schemars08 = { package = "schemars", version = "=0.8.22", default-features = false }
schemars1 = { package = "schemars", version = "=1.2.1", default-features = false }
serde_json = "=1.0.151"
