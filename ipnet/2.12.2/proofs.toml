[report]
title = "ipnet 2.12.2 core, CIDR, containment, IPv4/IPv6 iteration, and value traits"
explanation = "One hundred sixty public contracts (acceptance gated by the frozen full verifier) cover selected IPv4 and IPv6 core methods, independent CIDR arithmetic, containment, concrete and cross-family masks, concrete and tagged structural value traits, singleton error value traits, full runtime assertion constructors, full raw concrete and tagged range iteration, and full raw concrete and tagged subnet next classification. Actual-call subnet traces prove finite ordered disjoint partition, fixed-prefix enumeration and globally minimum count against arbitrary finite canonical exact covers for both families. IPv6 count and tagged count preserve exact checked usize overflow on the pinned 64-bit target."
trusted_assumptions = "Rust-to-LLBC-to-Lean translation and selected Aeneas standard-library semantics. Reviewed narrow boundaries include concrete IPv4/IPv6 Ord::cmp correspondence; U32/U128 trailing_zeros intrinsic models; exact eight-segment IPv6Addr::new byte-layout model; drop-free Result::ok applications; array/slice/scalar equality and baseline PartialOrd::le default models. Pure checked scalar MAX+1 and Unit clone lemmas add no semantic model. Lean binder hygiene alpha-renames namespace-shadowing locals without changing application bodies. See verification/model-boundaries.md. The transitive Lean audit accepts only propext, Classical.choice, and Quot.sound."
limitations = "This is selected API coverage, not whole-crate verification. IPv4/IPv6 aggregation, address parsing and formatting, Hash, optional serde/schemars integrations, and unselected inherited defaults remain outside the public mappings. Live raw subnet iterators with q above family width follow a checked modeled panic path. IPv6 count of a range longer than usizeMAX fails with checked integerOverflow; the usize theorem assumes a 64-bit platform. Rust correspondence for reviewed standard-library models is external, not a proved Rust body. Native tests are separate finite observations."
environment = "macOS arm64; exact tool revisions in verification/toolchain.json"

