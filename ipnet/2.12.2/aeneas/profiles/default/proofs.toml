[report]
title = "Selected network and iterator behavior in ipnet 2.12.2"
explanation = '''
The selected IPv4, IPv6 and `IpNet` operations preserve the address supplied to a valid constructor, including host bits. `new` rejects prefixes longer than the address width; `new_assert` succeeds for valid prefixes. Network and broadcast return the lower and upper endpoints of the represented address set, while `trunc` replaces the stored address with its lower endpoint. These guarantees include `/0` and full-width prefixes.

The selected contracts also describe masks, containment, supernets, sibling checks, address arithmetic, value comparisons and range and subnet iterator operations. Containment across address families is false. Sibling checks include a network compared with itself when its prefix is positive and the parent matches. The mapped iterator contracts specify their results and state transitions, including exhaustion and specified errors or modeled panic paths. The mapping lists the particular methods and their preconditions.

For both address families, actual-call subnet traces establish ordered, disjoint partitions and minimum block counts among finite canonical exact covers whose block prefixes are at least the requested prefix, for arbitrary raw endpoints and valid requested prefixes `q ≤ 32` for IPv4 or `q ≤ 128` for IPv6. Some range count and size contracts require a 64-bit platform; counts exceeding `usize::MAX` retain checked overflow behavior.

These claims concern the selected release bodies and contracts, not every API. Native tests and the optional-integration findings below are separate observations.
'''
trusted_assumptions = '''
The selected crate bodies are extracted from the unchanged ipnet 2.12.2 release source. The source inventory and before-and-after checks establish the identity of those inputs; they do not independently prove that translation preserves every Rust behavior. The results depend on Rust-to-LLBC-to-Lean translation and selected standard-library models.

For address ordering, the model compares big-endian numeric values. The pinned Rust IPv4 comparison orders its octets lexicographically; the IPv6 comparison orders eight segments, each formed from a pair of octets. On the checked little-endian target, those orders agree with the corresponding big-endian numbers. The IPv6 constructor model similarly concatenates the big-endian bytes of its eight segments, matching the reviewed source's byte conversion and layout on that target. These are source-based correspondence arguments, not Lean proofs of Rust layout or comparator semantics. The concrete `Result::ok` model follows the source's variant match for the selected drop-free network and error types; it does not establish behavior for arbitrary destructors. The trailing-zero models reverse fixed-width bits and count leading zeros, matching the reviewed intrinsic's low-zero count, including zero yielding the bit width. These correspondences remain trusted even though the resulting model properties are kernel checked.

The independently pinned Aeneas patch supplies those narrow models and checked shift wrappers; the Charon patch lowers recorded true MIR undefined-behavior checks and represents divergent panic paths using the existing panic model, and selects the IPv6 constructor. This does not establish general abort or unwind equivalence. Checked shift-overflow examples, pinned standard-library source hashes, fresh extraction and the full theorem audit support this configuration but do not prove all Rust/model correspondence. Arithmetic lemmas about unchanged scalar models are kernel proofs about those models, not proofs of the Rust intrinsics. Runtime overflow and undefined-behavior checks were enabled and contract checks disabled. Lean's foundational `propext`, `Classical.choice` and `Quot.sound` are allowed by the transitive axiom audit.
'''
limitations = '''
Parsing, formatting, aggregation, hashing, optional serde and schemars integrations, and unselected inherited defaults are outside the mapped claims. A nonempty raw subnet iterator with a requested prefix above the address-family width follows a modeled panic path. `new_assert` likewise does not have a total-success claim for invalid prefixes.

The model does not establish physical runtime behavior, general const evaluation, panic formatting, or abort/unwind equivalence. The accepted target is macOS arm64; retained Linux models are not an accepted run of this configuration. Full original logs are in a local evidence archive, and the committed summary is not a cargo-proofs SARIF recording.
'''
environment = '''
The 2026-10-27 macOS arm64 run used the default formal features, Lean 4.35.0, Rust 1.91.1 for native tests and nightly-2026-09-17 for extraction. Fresh extraction matched the maintained model, and the Lean build, transitive axiom audit, mapping and runtime/shift checks passed. Default, no-default and all-features native tests passed separately. The local results and evidence summary record the configuration and evidence boundaries.
'''

[[report.findings]]
title = "IpNet schema rejects valid serialized IPv4 networks"
body = '''
## Description

A serialized `IpNet` should satisfy its generated schema. Both schema integrations reject the serialized IPv4 networks `192.168.0.0/24` and `0.0.0.0/0`: each matches both `oneOf` branches. The IPv6 control `fd00::/32` is accepted. The pattern and `oneOf` combination are in [the 0.8 integration](https://github.com/krisprice/ipnet/blob/13c5c5873c02127679b1e8e64b538e4e36942640/src/ipnet_schemars_08.rs) and [the 1.x integration](https://github.com/krisprice/ipnet/blob/13c5c5873c02127679b1e8e64b538e4e36942640/src/ipnet_schemars_1.rs). Making the schemas disjoint needs to preserve valid embedded-IPv4 IPv6 forms; changing `oneOf` alone would leave a separate schema/parser mismatch.

## Steps to Reproduce

Create a project with these files and run `cargo run`.

### `Cargo.toml`

```toml
[package]
name = "ipnet-schema-repro"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ipnet = { version = "=2.12.2", features = ["serde", "schemars08", "schemars1"] }
schemars08 = { package = "schemars", version = "=0.8.22", default-features = false }
schemars1 = { package = "schemars", version = "=1.2.1", default-features = false }
serde_json = "=1.0.151"
jsonschema = { version = "=0.33.0", default-features = false }
```

### `src/main.rs`

```rust
use ipnet::IpNet;
use serde_json::Value;

fn main() {
    let schemas: [(&str, Value); 2] = [
        ("schemars08", serde_json::to_value(schemars08::schema_for!(IpNet)).unwrap()),
        ("schemars1", serde_json::to_value(schemars1::schema_for!(IpNet)).unwrap()),
    ];
    for (name, schema) in schemas {
        let validator = jsonschema::validator_for(&schema).unwrap();
        for input in ["192.168.0.0/24", "0.0.0.0/0"] {
            let net: IpNet = input.parse().unwrap();
            let value = serde_json::to_value(net).unwrap();
            let accepted = validator.is_valid(&value);
            println!("{name}: serialized {value}, schema accepts: {accepted}");
            assert!(!accepted);
        }
        let value = serde_json::to_value("fd00::/32".parse::<IpNet>().unwrap()).unwrap();
        assert!(validator.is_valid(&value));
    }
}
```

The program exits successfully when the observed discrepancy is reproduced.

## Expected Behavior

Serialized network values are accepted by their generated schema.

## Actual Behavior

The IPv4 values match both `oneOf` branches and are rejected.

## Environment

ipnet 2.12.2 with `serde`, `schemars08` and `schemars1`; Schemars 0.8.22 and 1.2.1, serde_json 1.0.151, Rust jsonschema 0.33.0, Rust 1.91.1 and macOS arm64.

'''

[[report.findings]]
title = "IPv6 and IpNet schemas accept strings deserialization rejects"
body = '''
## Description

Both generated IPv6 and `IpNet` schemas accept `a/64`, but Serde deserialization rejects it. Should these schemas accept strings that their corresponding types cannot deserialize?

## Steps to Reproduce

Create a project with these files and run `cargo run`.

### `Cargo.toml`

```toml
[package]
name = "ipnet-schema-repro"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ipnet = { version = "=2.12.2", features = ["serde", "schemars08", "schemars1"] }
schemars08 = { package = "schemars", version = "=0.8.22", default-features = false }
schemars1 = { package = "schemars", version = "=1.2.1", default-features = false }
serde_json = "=1.0.151"
jsonschema = { version = "=0.33.0", default-features = false }
```

### `src/main.rs`

```rust
use ipnet::{IpNet, Ipv6Net};
use serde_json::{json, Value};

fn main() {
    let value = json!("a/64");
    assert!(serde_json::from_value::<IpNet>(value.clone()).is_err());
    assert!(serde_json::from_value::<Ipv6Net>(value.clone()).is_err());
    let schemas: [(&str, Value); 4] = [
        ("schemars08 IpNet", serde_json::to_value(schemars08::schema_for!(IpNet)).unwrap()),
        ("schemars08 Ipv6Net", serde_json::to_value(schemars08::schema_for!(Ipv6Net)).unwrap()),
        ("schemars1 IpNet", serde_json::to_value(schemars1::schema_for!(IpNet)).unwrap()),
        ("schemars1 Ipv6Net", serde_json::to_value(schemars1::schema_for!(Ipv6Net)).unwrap()),
    ];
    for (name, schema) in schemas {
        let accepted = jsonschema::validator_for(&schema).unwrap().is_valid(&value);
        println!("{name}: {value} accepted: {accepted}; deserialization rejects it");
        assert!(accepted);
    }
}
```

The program exits successfully when the observed discrepancy is reproduced.

## Expected Behavior

The relationship between schema acceptance and deserialization is clarified for this input.

## Actual Behavior

Both schemas accept `a/64` under both Schemars integrations, while deserialization into either type rejects it.

## Environment

ipnet 2.12.2 with `serde`, `schemars08` and `schemars1`; Schemars 0.8.22 and 1.2.1, serde_json 1.0.151, Rust jsonschema 0.33.0, Rust 1.91.1 and macOS arm64.

'''

[[report.findings]]
title = "Heapless serialization uses an allocating path"
body = '''
## Description

The documented `heapless` feature is intended to avoid allocation during serialization. With a human-readable serializer whose `serialize_str` does not allocate, `255.255.255.255/32` caused three allocations or reallocations with `heapless`; `serde` plus `ser_as_str` caused none and produced the same 18 bytes. A separate IPv6 control recorded four versus zero. Counts depend on the allocator and toolchain; the example checks positive versus zero.

## Steps to Reproduce

Create a project with the following files and run the commands.

### `Cargo.toml`

```toml
[package]
name = "ipnet-heapless-feature-repro"
version = "0.0.0"
publish = false
edition = "2021"
default-run = "ipnet-heapless-feature-repro"

[workspace]

[features]
heapless = ["ipnet/heapless"]
legacy = ["ipnet/serde", "ipnet/ser_as_str"]

[dependencies]
ipnet = "=2.12.2"
heapless = "=0.9.2"
serde = "=1.0.229"
```

### `src/main.rs`

```rust
use std::alloc::{GlobalAlloc, Layout, System};
use std::sync::atomic::{AtomicUsize, Ordering};
use serde::{Serialize, Serializer};
use serde::ser::Impossible;
static ALLOCS: AtomicUsize = AtomicUsize::new(0);
struct Counting;
unsafe impl GlobalAlloc for Counting {
    unsafe fn alloc(&self, l: Layout) -> *mut u8 { ALLOCS.fetch_add(1, Ordering::SeqCst); System.alloc(l) }
    unsafe fn dealloc(&self, p: *mut u8, l: Layout) { System.dealloc(p,l) }
    unsafe fn realloc(&self,p:*mut u8,l:Layout,n:usize)->*mut u8 { ALLOCS.fetch_add(1,Ordering::SeqCst); System.realloc(p,l,n) }
}
#[global_allocator] static ALLOCATOR: Counting = Counting;
#[derive(Debug)] struct E;
impl std::fmt::Display for E { fn fmt(&self,f:&mut std::fmt::Formatter<'_>)->std::fmt::Result { f.write_str("unsupported") } }
impl std::error::Error for E {}
impl serde::ser::Error for E { fn custom<T: std::fmt::Display>(_:T)->Self { E } }
struct Sink;
macro_rules! unsupported_scalar { ($($n:ident:$t:ty),*) => {$ (fn $n(self,_:$t)->Result<usize,E>{Err(E)})*}; }
impl Serializer for Sink {
    type Ok=usize; type Error=E;
    type SerializeSeq=Impossible<usize,E>; type SerializeTuple=Impossible<usize,E>;
    type SerializeTupleStruct=Impossible<usize,E>; type SerializeTupleVariant=Impossible<usize,E>;
    type SerializeMap=Impossible<usize,E>; type SerializeStruct=Impossible<usize,E>;
    type SerializeStructVariant=Impossible<usize,E>;
    unsupported_scalar!(serialize_bool:bool,serialize_i8:i8,serialize_i16:i16,serialize_i32:i32,serialize_i64:i64,serialize_u8:u8,serialize_u16:u16,serialize_u32:u32,serialize_u64:u64,serialize_f32:f32,serialize_f64:f64,serialize_char:char);
    fn serialize_str(self,v:&str)->Result<usize,E>{ assert_eq!(v,"255.255.255.255/32"); Ok(v.len()) }
    fn serialize_bytes(self,_:&[u8])->Result<usize,E>{Err(E)}
    fn serialize_none(self)->Result<usize,E>{Err(E)}
    fn serialize_some<T:?Sized+Serialize>(self,_:&T)->Result<usize,E>{Err(E)}
    fn serialize_unit(self)->Result<usize,E>{Err(E)}
    fn serialize_unit_struct(self,_:&'static str)->Result<usize,E>{Err(E)}
    fn serialize_unit_variant(self,_:&'static str,_:u32,_:&'static str)->Result<usize,E>{Err(E)}
    fn serialize_newtype_struct<T:?Sized+Serialize>(self,_:&'static str,_:&T)->Result<usize,E>{Err(E)}
    fn serialize_newtype_variant<T:?Sized+Serialize>(self,_:&'static str,_:u32,_:&'static str,_:&T)->Result<usize,E>{Err(E)}
    fn serialize_seq(self,_:Option<usize>)->Result<Self::SerializeSeq,E>{Err(E)}
    fn serialize_tuple(self,_:usize)->Result<Self::SerializeTuple,E>{Err(E)}
    fn serialize_tuple_struct(self,_:&'static str,_:usize)->Result<Self::SerializeTupleStruct,E>{Err(E)}
    fn serialize_tuple_variant(self,_:&'static str,_:u32,_:&'static str,_:usize)->Result<Self::SerializeTupleVariant,E>{Err(E)}
    fn serialize_map(self,_:Option<usize>)->Result<Self::SerializeMap,E>{Err(E)}
    fn serialize_struct(self,_:&'static str,_:usize)->Result<Self::SerializeStruct,E>{Err(E)}
    fn serialize_struct_variant(self,_:&'static str,_:u32,_:&'static str,_:usize)->Result<Self::SerializeStructVariant,E>{Err(E)}
    // Intentionally retain serde's default collect_str, which calls to_string().
}
fn main(){
    let n:ipnet::Ipv4Net="255.255.255.255/32".parse().unwrap();
    ALLOCS.store(0,Ordering::SeqCst);
    let len=n.serialize(Sink).unwrap();
    let allocations=ALLOCS.load(Ordering::SeqCst);
    println!("heapless={} legacy={} bytes={} allocations={}",cfg!(feature="heapless"),cfg!(feature="legacy"),len,allocations);
    if cfg!(feature="legacy") {assert_eq!(allocations,0);} else {assert!(allocations>0);}
}
```

From the project directory:

```sh
cargo +1.91.1 generate-lockfile --manifest-path Cargo.toml
cargo +1.91.1 update --manifest-path Cargo.toml -p serde --precise 1.0.229
cargo +1.91.1 update --manifest-path Cargo.toml -p heapless --precise 0.9.2
cargo +1.91.1 run --locked --manifest-path Cargo.toml --features heapless
cargo +1.91.1 run --locked --manifest-path Cargo.toml --features legacy
```

The sink checks the exact output and does not allocate in `serialize_str`. Counters are reset after parsing and read before printing. The `legacy` feature enables `serde` and `ser_as_str`; the `heapless` fixture feature enables `ipnet/heapless`.


## Expected Behavior

The heapless serialization path avoids allocation with this serializer.

## Actual Behavior

The heapless case allocates; the `ser_as_str` control does not.

## Environment

ipnet 2.12.2, serde 1.0.229, heapless 0.9.2, Rust 1.91.1 and macOS arm64.

'''

