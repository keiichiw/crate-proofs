[report]
title = "integer-encoding 4.1.0: selected scalar encoding and fixed-width operations"
explanation = '''
For the built-in `u8`, `u16`, `u32`, `u64`, `usize` and corresponding signed types, the selected contracts establish the canonical low-group-first base-128 encoding. Signed values first undergo ZigZag: `2*z` for nonnegative `z`, and `-2*z-1` for negative `z`. `required_space` returns the exact number of bytes, and `encode_var_vec` returns those bytes. When the destination has at least that many bytes, `encode_var` succeeds, returns the count, writes exactly those bytes and preserves the remaining suffix. For example, zero encodes as `[0]`.

Fixed-width encoding returns the scalar's little-endian bytes, including the two's-complement representation of signed values. Slice encoding succeeds only when the destination length equals the scalar's byte width; on any other length it returns `None` without changing the destination. Slice decoding likewise accepts exactly that width and interprets the bytes as little-endian with the target's signedness. `switch_endianness` returns the value represented by the reversed fixed-width bytes. These guarantees cover the array and vector encoding variants as well. The `usize` and `isize` fixed-width claims require a 64-bit pointer width.

The October 27, 2026 macOS arm64 run checked 80 selected scalar API mappings against the release bodies. It also checked short-buffer assertion failures in the extracted debug-assertion profile; those do not establish the release failure tag or destination state after unwinding. Native tests and the findings below are separate observations.
'''
trusted_assumptions = '''
The result relies on Rust-to-Charon/Aeneas translation, Lean and the standard scalar and library models. The fixed-width supplement models `size_of` by scalar cardinality only for the ten selected primitive types, where the resulting 1, 2, 4 or 8 bytes agree with Rust's primitive sizes. Its `clone_from_slice` model copies bytes on equal lengths and panics otherwise; the extracted calls use the standard `u8` clone implementation, not arbitrary user-defined cloning. Pointer-sized endian conversions use 64-bit primitives and preserve all bits under the stated 64-bit premise.

For fixed decoding, the model erases the formatting dictionary for the standard `TryFromSliceError`: the modeled unwrap still returns the `Ok` payload or panics on `Err`, but does not represent panic formatting or its effects. Source inspection supports these restricted model choices; it is not a proof of the Rust compiler or standard library. Allocation failures, panic text, hooks and unwinding effects are not established. The theorem audit allowed Lean's `propext`, `Classical.choice` and `Quot.sound`, with no application axioms.
'''
limitations = '''
The checked executable bodies come from the locked crates.io 4.1.0 source, with generated bodies checked against fresh extraction. This is not a proof of compiler or translation correctness. The ten `decode_var` instances are blocked by the pinned translator and are not proved. Generic and asynchronous I/O, custom trait implementations and other unselected APIs are outside the formal scope. A destination shorter than the canonical varint is outside the successful encoding contract and may panic. The short-buffer theorem's modeled debug assertion does not describe release behavior or unwind state.

The accepted run is for macOS arm64; the separately maintained Linux models have not been accepted in this configuration. Native examples are finite observations, not proofs of the excluded I/O behavior or of big-endian execution.
'''
environment = '''
The October 27, 2026 current-input run used `aarch64-apple-darwin`, default crate features, debug assertions in extraction, the pinned Charon and Aeneas revisions and Lean 4.35.0. Native checks separately used default features in debug and release. Fresh extraction matched the maintained models, and the Lean build, theorem dependency audit and API mapping checks passed with matching before-and-after input fingerprints. The earlier accepted archive records its own historical inputs. The run predates this editorial revision; its input fingerprint does not cover the revised prose.

The cargo-proofs preparation patch prepares pinned inputs and tools before discovery and records the standard Lake build and audit results; it does not patch Charon or Aeneas. Its CLI tests and real Lean/Aeneas integration tests passed, including rejection cases. The patch’s operational tests do not prove translation or model fidelity. See the [results](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/integer-encoding/4.1.0/aeneas/aeneas/profiles/default/results.md), [specification](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/integer-encoding/4.1.0/aeneas/aeneas/profiles/default/specification.md), [API inventory](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/integer-encoding/4.1.0/aeneas/aeneas/profiles/default/api-inventory.md), [model boundary review](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/integer-encoding/4.1.0/aeneas/aeneas/profiles/default/trust-boundary.md), [tool lock](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/integer-encoding/4.1.0/aeneas/aeneas/profiles/default/toolchain.lock.json), and [preparation patch](https://github.com/keiichiw/crate-proofs/blob/4e643e6b061aebf357d7c2195d1e16c4c574ddca/integer-encoding/4.1.0/aeneas/aeneas/profiles/default/patches/cargo-proofs-preparation.patch).
'''

[[report.findings]]
title = "VarIntReader can leave a complete varint partially consumed"
body = '''
## Description

Reading an out-of-range value can stop in the middle of a complete varint. A subsequent read then interprets the remaining bytes as another value, losing stream framing.

## Steps to Reproduce

`Cargo.toml`:

```toml
[package]
name = "integer-encoding-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
integer-encoding = "=4.1.0"
```

`src/main.rs`:

```rust
use integer_encoding::VarIntReader;
use std::io::{Cursor, ErrorKind};

fn main() {
    let mut input = Cursor::new([0x80, 0x80, 0x80, 0x80, 0x01, 0x2a]);
    let err = input.read_varint::<u8>().unwrap_err();
    assert_eq!(err.kind(), ErrorKind::InvalidData);
    assert_eq!(input.position(), 3);
    assert_eq!(input.read_varint::<u8>().unwrap(), 128);
    assert_eq!(input.read_varint::<u8>().unwrap(), 42);
}
```

Run `cargo run`.

## Expected Behavior

The [reader documentation](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/reader.rs#L14-L23) says it generally reads a whole varint. The first five bytes encode 2^28, followed by the independent value 42; even if the first read reports an error, consuming the complete first value would leave 42 next.

## Actual Behavior

The assertions pass: the first read returns `InvalidData` after consuming three bytes. The next read consumes `80 01` as 128; only the following read reaches 42.

The [processor](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/reader.rs#L40-L63) limits stored bytes by the target type. The [reader loop](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/reader.rs#L94-L114) reads another byte before `push` rejects it. This is a synchronous reproduction; the async source has a similar loop but was not executed in the recorded investigation. The reproducer passed in debug and release with Rust 1.91.1 on macOS arm64 and default features. Later versions have not been checked.
'''

[[report.findings]]
title = "Complete out-of-range varint is reported as UnexpectedEof"
body = '''
## Description

A complete varint outside the target integer range produces `UnexpectedEof`, even though a trailing value is available. The reader documentation instead describes truncation of out-of-range values.

## Steps to Reproduce

`Cargo.toml`:

```toml
[package]
name = "integer-encoding-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
integer-encoding = "=4.1.0"
```

`src/main.rs`:

```rust
use integer_encoding::VarIntReader;
use std::io::{Cursor, ErrorKind};

fn main() {
    let mut input = Cursor::new([0xac, 0x02, 0x2a]);
    let err = input.read_varint::<u8>().unwrap_err();
    assert_eq!(err.kind(), ErrorKind::UnexpectedEof);
    assert_eq!(input.position(), 2);
    assert_eq!(input.read_varint::<u8>().unwrap(), 42);
}
```

Run `cargo run`.

## Expected Behavior

`ac 02` is the complete varint for 300. The [documentation](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/reader.rs#L17-L23) describes truncation for values outside the target range and associates `UnexpectedEof` with EOF. It does not specify a particular alternative error kind for range rejection.

## Actual Behavior

The assertions pass: the reader consumes the complete value, returns `UnexpectedEof`, and leaves 42 available. No integer is returned. The [reader](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/reader.rs#L94-L114) maps a failed decode to `UnexpectedEof`, including a numeric range rejection. This two-byte input fits the u8 stream byte limit, so it is distinct from the width-cap framing issue.

The reproducer passed in debug and release with Rust 1.91.1 on macOS arm64 and default features. Later versions have not been checked.
'''

[[report.findings]]
title = "Generic FixedInt I/O panics for a valid sixteen-byte implementation"
body = '''
## Description

The public synchronous `FixedIntReader` and `FixedIntWriter` adapters panic before I/O when given a safe sixteen-byte `FixedInt` implementation. Their public signatures do not state an eight-byte size limit.

## Steps to Reproduce

`Cargo.toml`:

```toml
[package]
name = "integer-encoding-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
integer-encoding = "=4.1.0"
```

`src/main.rs`:

```rust
use integer_encoding::{FixedInt, FixedIntReader, FixedIntWriter};
use std::io::Cursor;
use std::panic::{catch_unwind, AssertUnwindSafe};

#[derive(Clone, Copy, Debug, PartialEq)]
struct Fixed128(u128);

impl FixedInt for Fixed128 {
    type Bytes = [u8; 16];
    fn encode_fixed(self, dst: &mut [u8]) -> Option<()> {
        if dst.len() != 16 { return None; }
        dst.copy_from_slice(&self.0.to_le_bytes());
        Some(())
    }
    fn encode_fixed_light(self) -> Self::Bytes { self.0.to_le_bytes() }
    fn decode_fixed(src: &[u8]) -> Option<Self> {
        let bytes: [u8; 16] = src.try_into().ok()?;
        Some(Self(u128::from_le_bytes(bytes)))
    }
    fn switch_endianness(self) -> Self { Self(self.0.swap_bytes()) }
}

fn main() {
    let value = Fixed128(1);
    let mut bytes = [0; 16];
    assert_eq!(value.encode_fixed(&mut bytes), Some(()));
    assert_eq!(Fixed128::decode_fixed(&bytes), Some(value));
    let mut reader = Cursor::new(bytes);
    let read_panics = catch_unwind(AssertUnwindSafe(|| reader.read_fixedint::<Fixed128>())).is_err();
    let mut writer = Vec::new();
    let write_panics = catch_unwind(AssertUnwindSafe(|| writer.write_fixedint(value))).is_err();
    assert!(read_panics && write_panics);
    assert_eq!(reader.position(), 0);
    assert!(writer.is_empty());
}
```

Run `cargo run`.

## Expected Behavior

The generic adapters can process this complete, sixteen-byte little-endian representation, or their supported size restriction is made explicit.

## Actual Behavior

Both calls panic while slicing their buffers, before reading or writing any bytes. The program catches the panics and its assertions pass (the default panic hook may still print messages).

The [reader](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/reader.rs#L143-L149) and [writer](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/writer.rs#L69-L76) allocate eight-byte arrays and slice them using `size_of::<FI>()`. The [public trait](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/fixed.rs#L9-L35) does not state that `FI` must fit in eight bytes. The built-in types fit on the tested host; this finding concerns custom implementations. Async adapters show the same source pattern, but were not executed in the recorded investigation.

The reproducer caught both panics in debug and release with Rust 1.91.1 on macOS arm64 and default features. Later versions have not been checked.
'''

[[report.findings]]
title = "Clarify the exact slice length required by FixedInt methods"
body = '''
## Description

The `FixedInt` documentation describes failure when the destination has insufficient space, but does not state that a larger slice is also rejected by the built-in implementations.

## Steps to Reproduce

`Cargo.toml`:

```toml
[package]
name = "integer-encoding-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
integer-encoding = "=4.1.0"
```

`src/main.rs`:

```rust
use integer_encoding::FixedInt;

fn main() {
    let mut dst = [0xaa; 5];
    assert_eq!(42_u32.encode_fixed(&mut dst), None);
    assert_eq!(dst, [0xaa; 5]);
    assert_eq!(u32::decode_fixed(&dst), None);
}
```

Run `cargo run`.

**Observed:** For `u32`, the five-byte destination and input are rejected; encoding leaves the destination unchanged. The [documentation](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/fixed.rs#L13-L24) mentions insufficient space, while the [built-in implementation](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/fixed.rs#L39-L57) accepts exactly `size_of::<Self>()` bytes.

Please clarify the exact-length requirement for encoding and decoding, including oversized slices. The current wording is ambiguous; this report does not assume that it promises oversized destinations will succeed. The reproducer passed in debug and release with Rust 1.91.1 on macOS arm64 and default features. Later versions have not been checked.
'''

[[report.findings]]
title = "FixedInt overview and methods disagree about endianness"
body = '''
## Description

The [FixedInt overview](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/fixed.rs#L4-L9) says the emitted bytes use machine endianness. The same trait's [method descriptions](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/fixed.rs#L13-L32) describe little-endian encoding and decoding, including conversion on big-endian machines. These statements disagree on a big-endian host.

The [built-in implementations](https://github.com/dermesser/integer-encoding-rs/blob/e0a10d01e86a38d0df177676c62f9a10c845ab53/src/fixed.rs#L39-L64) use `to_le_bytes` and `from_le_bytes`. On Rust 1.91.1, macOS arm64, with default features, the output was also little-endian. This host observation does not establish behavior on every host.

Please make the overview and method descriptions consistent about the intended byte order. This is a documentation contradiction in integer-encoding 4.1.0; later upstream revisions have not been checked.
'''

