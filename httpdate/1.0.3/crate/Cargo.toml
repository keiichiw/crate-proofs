[package]
name = "httpdate"
version = "1.0.3"
authors = ["Pyfisch <pyfisch@posteo.org>"]
license = "MIT OR Apache-2.0"
description = "HTTP date parsing and formatting"
keywords = ["http", "date", "time", "simple", "timestamp"]
readme = "README.md"
repository = "https://github.com/pyfisch/httpdate"
edition = "2021"
rust-version = "1.91"

[dependencies]
creusot-std = "=0.13.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false
